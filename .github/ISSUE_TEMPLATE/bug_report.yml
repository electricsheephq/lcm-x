name: Bug or regression report
description: Report broken, incorrect, or regressed LCM-X behavior on Hermes.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough evidence for a maintainer to reproduce or verify it.

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: lcm_expand should return the matching source messages for the selected summary node.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: lcm_expand returned an empty result even though lcm_describe showed child content.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: List exact steps, commands, config, or a small scenario that reproduces the issue.
      placeholder: |
        1. Enable hermes-lcm with context.engine: lcm
        2. Run ...
        3. Call ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Affected commit SHA
      description: Exact LCM-X commit that exhibits the bug. Add a branch or release tag only as context.
      placeholder: Exact commit SHA for v0.23.0-rc2 or main, for example 0123456789abcdef...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Hermes Agent version, and relevant backend if known.
      placeholder: Arch Linux, Python 3.14, Hermes Agent ..., OpenRouter/Claude/etc.
    validations:
      required: false

  - type: textarea
    id: impact_regression
    attributes:
      label: Impact, regression range, and data symptoms
      description: Keep this to one independently reproducible problem. Use N/A when no regression range is known.
      placeholder: |
        User/operator impact and frequency:
        Last known good commit (or N/A):
        First known bad commit (or N/A):
        Current-main reproduction or named mandatory invariant:
        Workaround:
        Is context missing, duplicated, reordered, misattributed, or visible across sessions/profiles?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Include only the relevant LCM-X or Hermes config. Redact secrets.
      render: yaml
      placeholder: |
        context:
          engine: lcm
        lcm:
          ...
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs, traceback, or failing test
      description: Paste the error, traceback, failing assertion, or command output that proves the issue.
      render: text
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation attempted
      description: What did you run or check already?
      placeholder: |
        - pytest tests/test_lcm_engine.py -q -> fails at ...
        - python -m compileall -q . -> passes
    validations:
      required: false
