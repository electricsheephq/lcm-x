# Shared plugin bug form. Field ids and labels are FROZEN across our plugin repos: the
# report-a-problem skill drafts issues with these same headings, so do not rename them.
# Per repo: description, the security line, the diagnostics hint, and the surface options.
name: Bug report
description: Something in LCM-X is broken or behaves unexpectedly.
labels: ["bug", "triage-pending"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: >-
        **Security problems** (cross-session context exposure, unauthorized local reads, non-cloud credential leaks,
        or anything that exposes a secret) go to a [private advisory](https://github.com/electricsheephq/lcm-x/security/advisories/new),
        not here. **Problems in Hermes itself** belong in [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent/issues).
        Your Hermes agent can draft this report for you: ask it to "report a problem with LCM-X".
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: The hermes-lcm-x entry from `hermes plugins list --json` (version and source sha), or the exact commit SHA.
      placeholder: Exact commit SHA for v0.28.0 or main, for example 0123456789abcdef...
    validations:
      required: true
  - type: input
    id: hermes_version
    attributes:
      label: Hermes version
      description: Output of `hermes --version`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it happened
      options:
        - CLI/TUI
        - Desktop app
        - Telegram
        - Discord
        - Slack
        - Other messaging platform
        - Cron or background job
        - API server
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11 ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Read-only `/lcm status` and `/lcm doctor`, or the `lcm_status` and `lcm_doctor` tools with default arguments
        (slash commands are disabled by default; do not run repair or apply modes to reproduce). Add short log excerpts,
        for example from `hermes logs --since 1h -n 2000 | grep -i lcm`, only the relevant LCM-X or Hermes config, and
        what you already ran or checked. Leave out tokens, keys and private message text.
      render: text
  - type: textarea
    id: impact_regression
    attributes:
      label: Impact, regression range, and data symptoms
      description: Keep this to one independently reproducible problem. Use N/A when no regression range is known.
      placeholder: |
        User/operator impact and frequency:
        Last known good commit (or N/A):
        First known bad commit (or N/A):
        Current-main reproduction or named mandatory invariant:
        Workaround:
        Is context missing, duplicated, reordered, misattributed, or visible across sessions/profiles?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets, tokens or private messages.
          required: true
        - label: An AI agent helped draft this report, and I reviewed it.
