name: Reliability nightly

# R1 (in-process) + R2 (acp-process) reliability matrix on the pinned hosts in bench/instruments/reliability/hosts.ci.json.
# Not a required check. schedule and workflow_dispatch take effect once this file is on main.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/instruments/reliability/**"
      - ".github/workflows/reliability-nightly.yml"

permissions:
  contents: read
  issues: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        host: [eva-0.21.5, customer-0.21.2, r34.4-0.21.5, upstream-main]
    env:
      OUT: ${{ github.workspace }}/reliability-out
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0  # full history and tags: native-on-off cells export v0.23.3 / v0.24.3 (plugin_tree.resolve)

      - name: Set up Python (harness)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.11.26

      - name: Prepare the pinned Hermes tree for ${{ matrix.host }}
        run: python -m bench.instruments.reliability.ci prep --host "${{ matrix.host }}" --root "$RUNNER_TEMP/hosts" --out "$RUNNER_TEMP/hosts.json"

      - name: R1 in-process, all cells
        run: python bench/instruments/reliability/run_matrix.py --hosts-file "$RUNNER_TEMP/hosts.json" --hosts "${{ matrix.host }}" --plugin-ref HEAD --cells all --jobs 4 --out "$OUT/r1"

      - name: R2 acp-process, all cells
        run: python bench/instruments/reliability/run_matrix.py --transport acp-process --hosts-file "$RUNNER_TEMP/hosts.json" --hosts "${{ matrix.host }}" --plugin-ref HEAD --cells all --jobs 4 --out "$OUT/r2"

      - name: Job summary
        if: always()
        run: |
          for t in r1 r2; do
            if [ -f "$OUT/$t/MATRIX.md" ]; then cat "$OUT/$t/MATRIX.md" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-${{ matrix.host }}
          path: |
            reliability-out/*/results.jsonl
            reliability-out/*/run.json
            reliability-out/*/*.md
            reliability-out/*/cells/**/verdict.json
          if-no-files-found: warn

      - name: Gate (ERROR, or a G-REL-1 FAIL without an open targeted issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number' > "$RUNNER_TEMP/open-issues.txt"
          python -m bench.instruments.reliability.ci gate "$OUT/r1/results.jsonl" "$OUT/r2/results.jsonl" --open-issues "$RUNNER_TEMP/open-issues.txt"
