name: AI review exact-head issuer

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  pull_request_review:
    branches: [main]
    types: [submitted, edited, dismissed]
  repository_dispatch:
    types: [ai-review-receipts]

concurrency:
  group: ai-review-gate-global
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  issue:
    name: Issue exact-head AI review check
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile and validate trusted exact-head state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs'), cp = require('child_process');
            const owner = context.repo.owner, repo = context.repo.repo;
            const emit = async (prNumber, base, head, conclusion, summary) => {
              const externalId = `ai-review-gate:${prNumber}:${base}:${head}`;
              const listed = await github.paginate(github.rest.checks.listForRef,
                {owner, repo, ref: head, check_name: 'AI review exact-head', filter: 'all', per_page: 100});
              const matches = listed.filter(run => run.name === 'AI review exact-head' &&
                run.external_id === externalId && run.app?.id === 15368);
              const payload = {owner, repo, status: 'completed', conclusion,
                output: {title: 'Exact-head AI review', summary: summary.slice(0, 65000)}};
              if (matches.length > 1) {
                for (const match of matches)
                  await github.rest.checks.update({...payload, check_run_id: match.id});
                throw Error('DUPLICATE_TRUSTED_CHECK');
              }
              return matches.length === 1
                ? github.rest.checks.update({...payload, check_run_id: matches[0].id})
                : github.rest.checks.create({...payload, name: 'AI review exact-head',
                    head_sha: head, external_id: externalId});
            };
            const unresolvedThreads = async (prNumber) => {
              const query = `query($owner:String!,$repo:String!,$pr:Int!,$cursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100,after:$cursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}`;
              let cursor = null, unresolved = 0;
              do {
                const result = await github.graphql(query, {owner, repo, pr: prNumber, cursor});
                const page = result.repository.pullRequest.reviewThreads;
                unresolved += page.nodes.filter(node => !node.isResolved).length;
                cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
              } while (cursor);
              return unresolved;
            };
            const listFiles = async (prNumber, expectedCount) => {
              const files = await github.paginate(github.rest.pulls.listFiles,
                {owner, repo, pull_number: prNumber, per_page: 100});
              const currentNames = files.map(file => file?.filename);
              if (!Number.isInteger(expectedCount) || expectedCount < 0 ||
                  files.length !== expectedCount ||
                  currentNames.some(name => typeof name !== 'string' || !name) ||
                  new Set(currentNames).size !== expectedCount)
                throw Error('changed files incomplete');
              return [...new Set(files.flatMap(file =>
                [file.filename, file.previous_filename].filter(Boolean)))].sort();
            };
            const listTimeline = (prNumber) => github.paginate(
              github.rest.issues.listEventsForTimeline,
              {owner, repo, issue_number: prNumber, per_page: 100})
              .then(events => events
                .filter(event => ['base_ref_changed', 'head_ref_force_pushed', 'closed',
                  'reopened', 'convert_to_draft', 'ready_for_review'].includes(event.event))
                .map(event => ({event: event.event, id: event.id, created_at: event.created_at})));
            const listTrustedChecks = (head) => github.paginate(github.rest.checks.listForRef,
              {owner, repo, ref: head, check_name: 'AI review exact-head', filter: 'all', per_page: 100})
              .then(runs => runs.filter(run => run.name === 'AI review exact-head')
                .map(run => ({name: run.name, app_id: run.app?.id, external_id: run.external_id,
                  head_sha: run.head_sha, status: run.status, conclusion: run.conclusion,
                  output: run.output, output_summary: run.output?.summary})));
            const boundedArtifactRefs = (refs) => {
              if (!Array.isArray(refs) || refs.length < 1 || refs.length > 2)
                throw Error('review artifact refs invalid');
              const lanes = new Set(), ids = new Set();
              for (const ref of refs) {
                if (!ref || typeof ref !== 'object' || Array.isArray(ref) ||
                    Object.keys(ref).sort().join(',') !== 'lane,review_id' ||
                    !['acceptance', 'adversarial'].includes(ref.lane) ||
                    !Number.isSafeInteger(ref.review_id) || ref.review_id <= 0 ||
                    lanes.has(ref.lane) || ids.has(ref.review_id))
                  throw Error('review artifact refs invalid');
                lanes.add(ref.lane); ids.add(ref.review_id);
              }
              return refs;
            };
            const artifactRefsFromChecks = (checks, expectedExternalId, expectedHead) => {
              const exact = checks.filter(check => check.app_id === 15368 &&
                check.external_id === expectedExternalId && check.head_sha === expectedHead &&
                check.status === 'completed' && check.conclusion === 'success');
              if (exact.length > 1) throw Error('DUPLICATE_TRUSTED_CHECK');
              if (exact.length === 0) return [];
              const summary = exact[0].output_summary || exact[0].output?.summary;
              try {
                return boundedArtifactRefs(JSON.parse(summary).review_artifact_refs);
              } catch (_) {
                // Packet validity belongs to the protected validator. Malformed
                // packets supply no API-fetch locators and grant no authority.
                return [];
              }
            };
            const fetchReviewArtifacts = async (prNumber, refs) => {
              if (!Array.isArray(refs)) return {artifacts: [], errors: []};
              const ids = [...new Set(refs
                .map(ref => ref?.review_id)
                .filter(id => Number.isInteger(id) && id > 0))];
              const marker = '<!-- lcm-x-ai-review:v2\n', suffix = '\n-->';
              const listed = ids.length ? await github.paginate(github.rest.pulls.listReviews,
                {owner, repo, pull_number: prNumber, per_page: 100}) : [];
              const isAssessment = review => typeof review?.body === 'string' &&
                review.body.split(marker).length === 2 && review.body.endsWith(suffix);
              const isNewer = (candidate, selected) => {
                const candidateTime = Date.parse(candidate?.submitted_at);
                const selectedTime = Date.parse(selected?.submitted_at);
                if (!Number.isFinite(candidateTime) || !Number.isFinite(selectedTime) ||
                    !Number.isSafeInteger(candidate?.id) || !Number.isSafeInteger(selected?.id))
                  throw Error('review submission identity invalid');
                return candidateTime > selectedTime ||
                  (candidateTime === selectedTime && candidate.id > selected.id);
              };
              const artifacts = [], errors = [];
              for (const review_id of ids) {
                try {
                  const response = await github.rest.pulls.getReview({owner, repo,
                    pull_number: prNumber, review_id});
                  const review = response.data;
                  const superseding = listed.find(candidate =>
                    candidate.id !== review.id && candidate.user?.id === review.user?.id &&
                    candidate.commit_id === review.commit_id && candidate.state !== 'DISMISSED' &&
                    candidate.state !== 'PENDING' && isAssessment(candidate) &&
                    isNewer(candidate, review));
                  if (superseding) {
                    errors.push({review_id, status: null, superseded_by: superseding.id});
                    continue;
                  }
                  artifacts.push({review_id: review.id, state: review.state,
                    commit_id: review.commit_id, submitted_at: review.submitted_at,
                    user: {id: review.user?.id, login: review.user?.login,
                      type: review.user?.type}, body: review.body});
                } catch (error) {
                  errors.push({review_id, status: Number.isInteger(error?.status) ? error.status : null});
                }
              }
              return {artifacts, errors};
            };
            const runValidator = async (input, protectedSha) => {
              const source = await github.rest.repos.getContent({owner, repo,
                path: 'scripts/ai_review_gate.py', ref: protectedSha});
              if (Array.isArray(source.data) || source.data.encoding !== 'base64') throw Error('validator unavailable');
              fs.writeFileSync('/tmp/gate.py', Buffer.from(source.data.content, 'base64'));
              const run = cp.spawnSync('python', ['/tmp/gate.py'], {input: JSON.stringify(input), encoding: 'utf8'});
              if (run.error) throw run.error;
              return {run, result: JSON.parse(run.stdout || '{}')};
            };
            const snapshot = async (prNumber, defaultBranch, extraArtifactRefs = []) => {
              const live = await github.rest.pulls.get({owner, repo, pull_number: prNumber});
              const pr = live.data;
              try {
                const files = await listFiles(prNumber, pr.changed_files);
                const unresolved = await unresolvedThreads(prNumber);
                const timeline = await listTimeline(prNumber);
                const checks = await listTrustedChecks(pr.head.sha);
                const expectedExternalId = `ai-review-gate:${pr.number}:${pr.base.sha}:${pr.head.sha}`;
                const reviewArtifacts = await fetchReviewArtifacts(prNumber,
                  artifactRefsFromChecks(checks, expectedExternalId, pr.head.sha)
                    .concat(extraArtifactRefs));
                return {repository: `${owner}/${repo}`, pr_number: pr.number,
                  base_ref: pr.base.ref, base_sha: pr.base.sha, head_sha: pr.head.sha,
                  changed_paths: files, timeline_events: timeline,
                  unresolved_threads: unresolved, check_runs: checks,
                  review_artifacts: reviewArtifacts.artifacts,
                  review_artifact_errors: reviewArtifacts.errors,
                  api_complete: true, pagination_complete: true,
                  draft: pr.draft, state: pr.state, default_branch: defaultBranch};
              } catch (error) {
                // The live tuple was already read: carry it so a partial failure
                // fails the head that is actually live, not only the listed one.
                // A non-object throw is wrapped so the tuple and a message survive.
                const carrier = (error && typeof error === 'object') ? error : new Error(String(error));
                carrier.liveTuple = {base_ref: pr.base.ref, base_sha: pr.base.sha,
                  head_sha: pr.head.sha, state: pr.state, draft: pr.draft};
                throw carrier;
              }
            };
            const reconcileOpenPullRequests = async (defaultBranch, dispatchTarget, dispatchRefs) => {
              const open = await github.paginate(github.rest.pulls.list,
                {owner, repo, state: 'open', base: defaultBranch, per_page: 100});
              const snapshots = [], failures = [], listedTuples = [];
              for (const candidate of open) {
                try { snapshots.push(await snapshot(candidate.number, defaultBranch,
                  candidate.number === dispatchTarget ? dispatchRefs : [])); }
                catch (error) {
                  failures.push(`${candidate.number}:${error?.message ?? String(error)}`);
                  // Prefer the tuple pulls.get observed over the (possibly stale)
                  // list entry; when they differ, the listed tuple is failed too.
                  const live = error?.liveTuple;
                  snapshots.push({repository: `${owner}/${repo}`, pr_number: candidate.number,
                    base_ref: live?.base_ref ?? candidate.base?.ref, base_sha: live?.base_sha ?? candidate.base?.sha,
                    head_sha: live?.head_sha ?? candidate.head?.sha, state: live?.state ?? candidate.state,
                    draft: live?.draft ?? candidate.draft, default_branch: defaultBranch,
                    api_complete: false, pagination_complete: false, api_error: true,
                    changed_paths: [], timeline_events: [], check_runs: [], review_artifacts: [],
                    review_artifact_errors: []});
                  if (live && candidate.base?.sha && candidate.head?.sha &&
                      (live.base_sha !== candidate.base.sha || live.head_sha !== candidate.head.sha))
                    listedTuples.push({pr_number: candidate.number, base_sha: candidate.base.sha, head_sha: candidate.head.sha});
                }
              }
              if (failures.length) core.setFailed(`Failed to reset PRs: ${failures.join(',')}`);
              return {snapshots, failures, listedTuples};
            };
            const failKnownSnapshots = async (snapshots, reason) => {
              const writeFailures = [];
              for (const candidate of snapshots) {
                if (!candidate?.pr_number || !candidate?.base_sha || !candidate?.head_sha)
                  continue;
                try {
                  await emit(candidate.pr_number, candidate.base_sha, candidate.head_sha, 'failure', reason);
                } catch (error) {
                  writeFailures.push(`${candidate.pr_number}:${error.message}`);
                }
              }
              return writeFailures;
            };
            const finalReadInvalidPeers = async (peerResults, snapshots, defaultBranch, protectedSha) => {
              for (const peer of peerResults) {
                if (peer.preserve) continue;
                const original = snapshots.find(item => item.pr_number === peer.pr_number);
                let currentTuple = null, currentPeer = null;
                try {
                  if (!original?.base_sha || !original?.head_sha)
                    throw Error('invalid peer original tuple unavailable');
                  const current = await snapshot(peer.pr_number, defaultBranch);
                  currentTuple = current;
                  const currentValidated = await runValidator({schema_version: '2', mode: 'peer_only', peers: [current]}, protectedSha);
                  if (currentValidated.run.status !== 0 || currentValidated.result.decision !== 'PASS' ||
                      currentValidated.result.peers?.length !== 1)
                    throw Error('invalid peer final validation failed');
                  currentPeer = currentValidated.result.peers[0];
                } catch (error) {
                  // snapshot() carries the tuple it observed before a later read failed;
                  // that live head fails below exactly as a completed re-snapshot's would.
                  if (!currentTuple && error?.liveTuple)
                    currentTuple = {pr_number: peer.pr_number, base_sha: error.liveTuple.base_sha,
                      head_sha: error.liveTuple.head_sha};
                  const writeFailures = [];
                  if (original?.base_sha && original?.head_sha) {
                    try {
                      await emit(original.pr_number, original.base_sha, original.head_sha, 'failure',
                        `Invalid peer final read failed closed: ${error.message}`);
                    } catch (writeError) { writeFailures.push(writeError.message); }
                  }
                  if (currentTuple?.base_sha && currentTuple?.head_sha &&
                      (currentTuple.base_sha !== original?.base_sha || currentTuple.head_sha !== original?.head_sha)) {
                    try {
                      await emit(currentTuple.pr_number, currentTuple.base_sha, currentTuple.head_sha, 'failure',
                        `Invalid peer final read failed closed: ${error.message}`);
                    } catch (writeError) { writeFailures.push(writeError.message); }
                  }
                  const suffix = writeFailures.length ? `; failure writes: ${writeFailures.join(',')}` : '';
                  throw Error(`invalid peer final read failed: ${error.message}${suffix}`);
                }
                if (currentPeer.preserve) continue;
                const writeFailures = [];
                try {
                  await emit(original.pr_number, original.base_sha, original.head_sha, 'failure',
                    JSON.stringify(currentPeer));
                } catch (writeError) { writeFailures.push(writeError.message); }
                if (currentTuple.base_sha !== original.base_sha || currentTuple.head_sha !== original.head_sha) {
                  try {
                    await emit(currentTuple.pr_number, currentTuple.base_sha, currentTuple.head_sha, 'failure',
                      JSON.stringify(currentPeer));
                  } catch (writeError) { writeFailures.push(writeError.message); }
                }
                if (writeFailures.length)
                  throw Error(`invalid peer failure writes failed: ${writeFailures.join(',')}`);
              }
            };
            const finalReadPreservedPeers = async (peerResults, snapshots, defaultBranch, protectedSha) => {
              for (const peer of peerResults) {
                if (!peer.preserve) continue;
                const original = snapshots.find(item => item.pr_number === peer.pr_number);
                let currentTuple = null;
                try {
                  if (!original?.base_sha || !original?.head_sha)
                    throw Error('preserved peer original tuple unavailable');
                  const current = await snapshot(peer.pr_number, defaultBranch);
                  currentTuple = current;
                  const finalValidated = await runValidator({schema_version: '2', mode: 'peer_only', peers: [current]}, protectedSha);
                  if (finalValidated.run.status !== 0 || finalValidated.result.decision !== 'PASS' ||
                      finalValidated.result.peers?.length !== 1 || !finalValidated.result.peers[0].preserve)
                    throw Error('preserved peer final validation failed');
                } catch (error) {
                  // snapshot() carries the tuple it observed before a later read failed;
                  // that live head fails below exactly as a completed re-snapshot's would.
                  if (!currentTuple && error?.liveTuple)
                    currentTuple = {pr_number: peer.pr_number, base_sha: error.liveTuple.base_sha,
                      head_sha: error.liveTuple.head_sha};
                  const writeFailures = [];
                  try {
                    await emit(original.pr_number, original.base_sha, original.head_sha, 'failure',
                      `Preserved peer final read failed closed: ${error.message}`);
                  } catch (writeError) { writeFailures.push(writeError.message); }
                  if (currentTuple?.base_sha && currentTuple?.head_sha &&
                      (currentTuple.base_sha !== original?.base_sha || currentTuple.head_sha !== original?.head_sha)) {
                    try {
                      await emit(currentTuple.pr_number, currentTuple.base_sha, currentTuple.head_sha, 'failure',
                        `Preserved peer final read failed closed: ${error.message}`);
                    } catch (writeError) { writeFailures.push(writeError.message); }
                  }
                  const suffix = writeFailures.length ? `; failure writes: ${writeFailures.join(',')}` : '';
                  throw Error(`preserved peer final read failed: ${error.message}${suffix}`);
                }
              }
            };
            const repository = await github.rest.repos.get({owner, repo});
            const defaultBranch = repository.data.default_branch;
            const branch = await github.rest.repos.getBranch({owner, repo, branch: defaultBranch});
            const protectedSha = branch.data.commit.sha;
            const dispatchEvent = context.eventName === 'repository_dispatch';
            let prNumber = null, base = null, head = null, result = null;
            let dispatchRefs = [];
            let dispatch = null, sender = null, run_attempt = null;
            let liveTuple = null, resnapshotTuple = null;
            let conclusion = 'failure', summary = 'Validation failed closed.';
            try {
              if (dispatchEvent) {
                // Identify the dispatch target before any broader API work: an
                // identifiable target must reach the fail-closed emit even when
                // open-PR enumeration itself rejects.
                dispatch = context.payload.client_payload;
                if (!dispatch || typeof dispatch !== 'object' || Array.isArray(dispatch))
                  throw Error('dispatch payload invalid');
                sender = context.payload.sender;
                run_attempt = Number(process.env.GITHUB_RUN_ATTEMPT || '1');
                if (sender?.login !== '100yenadmin' || Number(sender?.id) !== 239388517 ||
                    sender?.type !== 'User' || context.actor !== '100yenadmin' || Number(process.env.GITHUB_ACTOR_ID) !== 239388517)
                  throw Error('dispatch producer unauthenticated');
                if (!Number.isInteger(run_attempt) || run_attempt !== 1)
                  throw Error('repository dispatch reruns cannot promote');
                if (typeof dispatch.pr_number !== 'number' || !Number.isInteger(dispatch.pr_number) || dispatch.pr_number <= 0) throw Error('dispatch PR number invalid');
                if ('receipts' in dispatch || typeof dispatch.dispatch_id !== 'string')
                  throw Error('dispatch packet invalid');
                dispatchRefs = boundedArtifactRefs(dispatch.review_artifact_refs);
                if (context.ref !== `refs/heads/${defaultBranch}` || context.sha !== protectedSha)
                  throw Error('dispatch must execute from current protected default branch');
                prNumber = dispatch.pr_number;
                const tuple = (await github.rest.pulls.get({owner, repo, pull_number: prNumber})).data;
                base = tuple.base.sha; head = tuple.head.sha;
              }
              const reconciled = await reconcileOpenPullRequests(defaultBranch, prNumber, dispatchRefs);
              const snapshots = reconciled.snapshots;
              if (dispatchEvent) {
                if (reconciled.failures.length) {
                  const writeFailures = await failKnownSnapshots(snapshots.concat(reconciled.listedTuples),
                    'Open PR reconciliation failed closed.');
                  const suffix = writeFailures.length ? `; failure writes: ${writeFailures.join(',')}` : '';
                  throw Error(`open PR reconciliation incomplete${suffix}`);
                }
                const priorTarget = snapshots.find(item => item.pr_number === prNumber);
                if (!priorTarget || priorTarget.api_complete !== true ||
                    priorTarget.pagination_complete !== true || priorTarget.repository !== `${owner}/${repo}` ||
                    priorTarget.base_ref !== defaultBranch || priorTarget.base_sha !== base || priorTarget.head_sha !== head ||
                    priorTarget.state !== 'open' || priorTarget.draft)
                  throw Error('dispatch target missing or drifted from reconciliation');
                const envelopeValidated = await runValidator({schema_version: '2', mode: 'dispatch_envelope',
                  target: priorTarget,
                  review_artifact_refs: dispatch.review_artifact_refs,
                  producer: {login: sender.login, id: Number(sender.id), type: sender.type},
                  run: {id: process.env.GITHUB_RUN_ID, attempt: run_attempt},
                  dispatch_id: dispatch.dispatch_id}, protectedSha);
                if (envelopeValidated.run.status !== 0 || envelopeValidated.result.decision !== 'PASS')
                  throw Error('dispatch packet invalid');
                const expectedExternalId = `ai-review-gate:${prNumber}:${base}:${head}`;
                const priorExactChecks = (priorTarget?.check_runs || []).filter(check =>
                  check.app_id === 15368 && check.external_id === expectedExternalId &&
                  check.head_sha === head && check.status === 'completed' && check.conclusion === 'success');
                if (priorExactChecks.length > 1) throw Error('DUPLICATE_TRUSTED_CHECK');
                const priorDispatchIds = [];
                if (priorExactChecks.length === 1) {
                  const priorValidated = await runValidator({schema_version: '2', mode: 'peer_only', peers: [priorTarget]}, protectedSha);
                  const priorPreserved = priorValidated.run.status === 0 && priorValidated.result.decision === 'PASS' &&
                    priorValidated.result.peers?.length === 1 && priorValidated.result.peers[0].preserve;
                  // The nonce of a trusted exact packet is consumed history whether or
                  // not its live-state fingerprint still validates: a packet invalidated
                  // by draft/ready, close/reopen, or a force-push away and back must still
                  // block a replay of the same dispatch. Only a PRESERVED packet that
                  // cannot yield its nonce aborts; an unreadable invalidated packet just
                  // contributes no history, so a fresh renewal proceeds.
                  const check = priorExactChecks[0];
                  const stored = check.output_summary || check.output?.summary;
                  try {
                    if (typeof stored !== 'string') throw Error('prior target packet missing');
                    const packet = JSON.parse(stored);
                    if (typeof packet.dispatch_id !== 'string') throw Error('prior target dispatch ID invalid');
                    priorDispatchIds.push(packet.dispatch_id);
                  } catch (error) {
                    if (priorPreserved) throw Error(`prior target packet invalid: ${error.message}`);
                  }
                }
                let target = null;
                try {
                  // Infra failures only: a validator crash, malformed output, an
                  // incomplete peer-result set, or an API rejection of the
                  // pre-validation reset / target re-snapshot leaves peer state
                  // UNKNOWN (the validator never reconciled the peers), so every
                  // known snapshot resets. A clean FAIL decision is NOT in this
                  // class — the validator evaluated every peer, so peers keep their
                  // own verdicts and only the dispatch target fails (below).
                  await emit(prNumber, base, head, 'failure', 'Protected base changed or stored packet invalid; validation started and fails closed until complete.');
                  target = await snapshot(prNumber, defaultBranch,
                    dispatch.review_artifact_refs);
                  resnapshotTuple = [target.base_sha, target.head_sha];
                  const input = {schema_version: '2', target, peers: snapshots.filter(item => item.pr_number !== prNumber),
                    review_artifact_refs: dispatch.review_artifact_refs,
                    producer: {login: sender.login, id: Number(sender.id), type: sender.type},
                    run: {id: process.env.GITHUB_RUN_ID, attempt: run_attempt},
                    dispatch_id: dispatch.dispatch_id, prior_dispatch_ids: priorDispatchIds};
                  const validated = await runValidator(input, protectedSha);
                  result = validated.result;
                  if (!result?.decision || !Array.isArray(result.peers) ||
                      result.peers.length !== input.peers.length)
                    throw Error('peer reconciliation validation incomplete');
                  if (result.decision === 'PASS' && validated.run?.status !== 0)
                    throw Error('validator exited non-zero with a PASS payload');
                  await finalReadInvalidPeers(result.peers || [], snapshots, defaultBranch, protectedSha);
                  await finalReadPreservedPeers(result.peers || [], snapshots, defaultBranch, protectedSha);
                } catch (error) {
                  // A re-snapshot that observed a drifted target head before a later
                  // read failed still carries that tuple; it fails with the dispatch
                  // tuple below instead of keeping whatever check it already holds.
                  if (error?.liveTuple && !resnapshotTuple)
                    resnapshotTuple = [error.liveTuple.base_sha, error.liveTuple.head_sha];
                  const writeFailures = await failKnownSnapshots(snapshots.concat(reconciled.listedTuples),
                    `Peer reconciliation validation failed closed: ${error.message}`);
                  const suffix = writeFailures.length ? `; failure writes: ${writeFailures.join(',')}` : '';
                  throw Error(`peer reconciliation validation failed: ${error.message}${suffix}`);
                }
                if (result.decision !== 'PASS') throw Error('review assessment validation failed');
                const live = await github.rest.pulls.get({owner, repo, pull_number: prNumber});
                liveTuple = [live.data.base.sha, live.data.head.sha];
                const liveBranch = await github.rest.repos.getBranch({owner, repo, branch: defaultBranch});
                const liveFiles = await listFiles(prNumber, live.data.changed_files);
                const liveTimeline = await listTimeline(prNumber);
                const liveUnresolved = await unresolvedThreads(prNumber);
                const finalReviewArtifacts = await fetchReviewArtifacts(prNumber,
                  dispatch.review_artifact_refs);
                const finalTarget = {...target, repository: `${owner}/${repo}`,
                  pr_number: prNumber, base_ref: live.data.base.ref,
                  base_sha: live.data.base.sha, head_sha: live.data.head.sha,
                  changed_paths: liveFiles, timeline_events: liveTimeline,
                  unresolved_threads: liveUnresolved,
                  review_artifacts: finalReviewArtifacts.artifacts,
                  review_artifact_errors: finalReviewArtifacts.errors,
                  draft: live.data.draft, state: live.data.state};
                const finalArtifactValidation = await runValidator({schema_version: '2',
