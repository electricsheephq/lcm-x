name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint GitHub Actions workflows
        run: |
          "$(go env GOPATH)"/bin/actionlint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.13

      - name: Lint with ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check out pinned Hermes package-manager reference
        if: matrix.python-version == '3.14'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: 0a374d167424cdc730ce9761368b62255b551e58
          path: .hermes-pm-reference
          persist-credentials: false

      - name: Keep the host reference outside the plugin checkout
        if: matrix.python-version == '3.14'
        run: mv "$GITHUB_WORKSPACE/.hermes-pm-reference" "$RUNNER_TEMP/hermes-pm-reference"

      - name: Install test dependencies
        run: python -m pip install pytest numpy

      - name: Install the pinned package-manager test dependencies
        if: matrix.python-version == '3.14'
        env:
          HERMES_PM_REFERENCE: ${{ runner.temp }}/hermes-pm-reference
        run: |
          python -c 'import os, pathlib, subprocess, sys, tomllib; source = pathlib.Path(os.environ["HERMES_PM_REFERENCE"]); deps = tomllib.loads((source / "pm" / "pyproject.toml").read_text())["project"]["dependencies"]; subprocess.run([sys.executable, "-m", "pip", "install", *deps], check=True)'

      - name: Stub hermes-agent ABC
        run: |
          mkdir -p agent
          cat > agent/__init__.py <<'STUB'
          STUB
          cat > agent/context_engine.py <<'STUB'
          """Minimal stub of hermes-agent ContextEngine ABC for CI."""
          class ContextEngine:
              """Base class stub — just enough for LCMEngine to import."""
              def __init__(self, **kwargs):
                  self.compression_count = 0
                  self.last_prompt_tokens = 0
              def compress(self, messages, current_tokens=None, **kwargs):
                  raise NotImplementedError
              def on_session_start(self, session_id, **kwargs):
                  pass
              def on_session_end(self, **kwargs):
                  pass
              def on_session_reset(self):
                  self.compression_count = 0
                  self.last_prompt_tokens = 0
              def get_tool_schemas(self):
                  return []
              def handle_tool_call(self, name, args, **kwargs):
                  raise NotImplementedError
              def get_status(self):
                  return {}
          STUB

      # This existing required matrix lane matches the pinned PM runtime (Python 3.14).
      - name: Require real Hermes dependency staging
        if: matrix.python-version == '3.14'
        env:
          LCM_REQUIRE_REAL_HERMES: "1"
          LCM_REAL_HERMES_SRC: ${{ runner.temp }}/hermes-pm-reference
        run: |
          export LCM_REAL_HERMES_PYTHON
          LCM_REAL_HERMES_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          python -m pytest tests/test_packaging_install.py::test_plugin_manifest_numpy_declaration_stages_with_real_package_manager -q

      - name: Run pytest under low file descriptor limit
        run: |
          ulimit -n 1024
          python -m pytest tests/ -q

      - name: Run static validation
        run: |
          python -m compileall -q .
          python -m py_compile scripts/import_lossless_claw.py
          bash -n scripts/install.sh
          git diff --check
