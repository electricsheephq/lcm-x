name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint GitHub Actions workflows
        run: |
          "$(go env GOPATH)"/bin/actionlint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.13

      - name: Lint with ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest==9.1.1 pytest-xdist==3.8.0 numpy ruff==0.15.13 hypothesis==6.141.1

      - name: Use the runtime SQLite library
        uses: ./.github/actions/sqlite-runtime

      - name: Stub hermes-agent ABC
        run: |
          mkdir -p agent
          cat > agent/__init__.py <<'STUB'
          STUB
          cat > agent/context_engine.py <<'STUB'
          """Dependency-free ContextEngine contract shared by the pinned hosts."""
          import copy
          import json
          from abc import ABC, abstractmethod

          class ContextEngine(ABC):
              last_prompt_tokens = 0
              last_completion_tokens = 0
              last_total_tokens = 0
              threshold_tokens = 0
              context_length = 0
              compression_count = 0
              threshold_percent = 0.75
              protect_first_n = 3
              protect_last_n = 6
              emit_automatic_compaction_status = True

              def __init__(self, **kwargs):
                  self.compression_count = 0
                  self.last_prompt_tokens = 0

              @property
              @abstractmethod
              def name(self):
                  raise NotImplementedError

              @abstractmethod
              def update_from_response(self, usage):
                  raise NotImplementedError

              @abstractmethod
              def should_compress(self, prompt_tokens=None):
                  raise NotImplementedError

              @abstractmethod
              def compress(self, messages, current_tokens=None, focus_topic=None, force=False, memory_context=""):
                  raise NotImplementedError

              def should_compress_info(self, prompt_tokens=None):
                  return self.should_compress(prompt_tokens), None

              def should_compress_preflight(self, messages):
                  return False

              def get_automatic_compaction_status_message(self, *, phase, default_message, **context):
                  return default_message if self.emit_automatic_compaction_status else None

              def on_session_start(self, session_id, **kwargs):
                  pass

              def on_session_end(self, session_id, messages):
                  pass

              def on_session_reset(self):
                  self.compression_count = 0
                  self.last_prompt_tokens = 0
                  self.last_completion_tokens = 0
                  self.last_total_tokens = 0

              def get_tool_schemas(self):
                  return []

              def handle_tool_call(self, name, args, **kwargs):
                  return json.dumps({"error": f"Unknown context engine tool: {name}"})

              def get_status(self):
                  last_prompt = max(self.last_prompt_tokens, 0)
                  return {
                      "last_prompt_tokens": last_prompt,
                      "threshold_tokens": self.threshold_tokens,
                      "context_length": self.context_length,
                      "usage_percent": min(100, last_prompt / self.context_length * 100) if self.context_length else 0,
                      "compression_count": self.compression_count,
                  }

              def clone_for_agent(self):
                  return copy.deepcopy(self)

              def update_model(self, model, context_length, base_url="", api_key="", provider="", api_mode=""):
                  # Host threshold resolution imports its compressor; keep this
                  # unit-test fallback dependency-free. LCMEngine overrides it.
                  self.context_length = context_length
          STUB

      - name: Fetch the rollback-reader commits
        # The old-reader tests run these releases' code against a store the
        # current code wrote; under CI a missing commit fails them (#841).
        run: git fetch --no-tags --depth=1 origin c36b46e3a7b1bff23cfa45fa117565ab8624441d f47b55e031b507b424ff5f480d8f2a80d358f1f0 6800cf45ad05280e6cf6fa9e1ad96c62b7132646 49e99a272d2d461e5c90732e7ef2bc20e96f0826 c67d7633d963a2ffd24cf90995189ee58e2f88c7 709099b3a397a7893a7abae8802ebe7bf605f79e

      - name: Print linked SQLite version
        run: python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

      - name: Run pytest under low file descriptor limit
        run: |
          ulimit -n 1024
          python -m pytest tests/ -q -m "not latency" -n 4 --ignore=tests/test_embedding_privacy.py
          # Runs alone: one of its tests asserts a wall-clock budget that
          # parallel load on the runner can exceed.
          python -m pytest tests/test_embedding_privacy.py -q -m "not latency"

      - name: Run static validation
        run: |
          python -m compileall -q .
          python -m py_compile scripts/import_lossless_claw.py
          bash -n scripts/install.sh
          git diff --check
