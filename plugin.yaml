name: hermes-lcm-x
version: 0.29.0
description: "LCM-X — Lossless Context Memory eXtension for Hermes, with a recoverable DAG-based context engine OmniMemEval: BEAM 100K 1st of 12, LongMemEval 2nd of 13."
author: "Voltropy / Hermes Community"
requires_hermes: ">=0.21.3"   # the plugin API floor (ctx.register_hook); matches the catalog entry
provides_tools:
  - lcm_grep
  - lcm_recall
  - lcm_query_state
  - lcm_compute
  - lcm_compile_evidence
  - lcm_evidence_pack
  - lcm_retrieve
  - lcm_recent
  - lcm_load_session
  - lcm_describe
  - lcm_expand
  - lcm_expand_query
  - lcm_status
  - lcm_inspect
  - lcm_doctor
  - lcm_memory
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - subagent_start
  - subagent_stop
