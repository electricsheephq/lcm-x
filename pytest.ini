[pytest]
addopts = --strict-markers --durations=25
# Keep only failing tests' tmp_path directories; a green full run otherwise leaves ~2.8 GB behind.
# pytest also removes the directory when only setup or teardown errored; to keep it, rerun that test with
# -o tmp_path_retention_policy=all.
tmp_path_retention_policy = failed
testpaths = tests
markers =
    issue(n): regression bound to a GitHub issue number
    latency: measured latency budget, exercised by the nightly latency cell
